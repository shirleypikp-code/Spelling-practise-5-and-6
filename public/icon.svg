<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative circles -->
  <circle cx="80" cy="90" r="28" fill="#ffffff" opacity="0.15" />
  <circle cx="440" cy="110" r="18" fill="#ffffff" opacity="0.2" />
  <circle cx="420" cy="420" r="32" fill="#ffffff" opacity="0.12" />
  <circle cx="90" cy="410" r="20" fill="#ffffff" opacity="0.15" />

  <!-- Open Book & Magic Sparkles -->
  <g filter="url(#glow)">
    <!-- Book Backing -->
    <path d="M120 340 C170 320, 240 320, 256 345 C272 320, 342 320, 392 340 L392 200 C342 180, 272 180, 256 205 C240 180, 170 180, 120 200 Z" fill="#EEF2FF" />
    
    <!-- Left Page -->
    <path d="M128 196 C174 178, 238 178, 252 201 L252 334 C238 314, 174 314, 128 332 Z" fill="#FFFFFF" />
    <!-- Right Page -->
    <path d="M384 196 C338 178, 274 178, 260 201 L260 334 C274 314, 338 314, 384 332 Z" fill="#F8FAFC" />

    <!-- Center spine highlight -->
    <line x1="256" y1="202" x2="256" y2="340" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />

    <!-- Book lines / spell marks on left page -->
    <line x1="150" y1="230" x2="230" y2="230" stroke="#818CF8" stroke-width="5" stroke-linecap="round" />
    <line x1="150" y1="255" x2="225" y2="255" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round" />
    <line x1="150" y1="280" x2="210" y2="280" stroke="#C7D2FE" stroke-width="5" stroke-linecap="round" />

    <!-- Book lines on right page -->
    <line x1="282" y1="230" x2="362" y2="230" stroke="#F472B6" stroke-width="5" stroke-linecap="round" />
    <line x1="287" y1="255" x2="362" y2="255" stroke="#F9A8D4" stroke-width="5" stroke-linecap="round" />
    <line x1="302" y1="280" x2="362" y2="280" stroke="#FBCFE8" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Big Glowing Star above book -->
  <g filter="url(#glow)">
    <polygon points="256,70 274,124 330,124 285,158 302,212 256,178 210,212 227,158 182,124 238,124" fill="url(#starGrad)" stroke="#CA8A04" stroke-width="3" stroke-linejoin="round" />
  </g>

  <!-- Letter badge blocks: A, B, C -->
  <g filter="url(#glow)">
    <!-- Block 'A' -->
    <rect x="110" y="380" width="80" height="70" rx="16" fill="#10B981" />
    <text x="150" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
    
    <!-- Block 'B' -->
    <rect x="216" y="390" width="80" height="70" rx="16" fill="#F59E0B" />
    <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>

    <!-- Block 'C' -->
    <rect x="322" y="380" width="80" height="70" rx="16" fill="#06B6D4" />
    <text x="362" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">C</text>
  </g>

  <!-- Sparkle stars -->
  <path d="M140 130 Q140 145 125 145 Q140 145 140 160 Q140 145 155 145 Q140 145 140 130 Z" fill="#FEF08A" />
  <path d="M370 120 Q370 135 355 135 Q370 135 370 150 Q370 135 385 135 Q370 135 370 120 Z" fill="#FEF08A" />
</svg>
